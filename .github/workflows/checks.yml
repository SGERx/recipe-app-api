---
name: Checks

on: [push]

jobs:
  test-lint:
    name: Test and Lint
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build
        run: docker compose build
      - name: Test
        run: docker compose run --rm app python manage.py test
      - name: Lint
        run: docker compose run --rm app flake8